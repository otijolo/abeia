server.port=${PORT:8088}
spring.application.name=backend-abeia

# Habilita logging claro e formatado
logging.level.br.unifor.abeia=INFO
logging.level.org.springframework.web=INFO

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

server.forward-headers-strategy=framework
server.error.include-message=always
firebase.database-url=${FIREBASE_DATABASE_URL:https://abeia-cc22d-default-rtdb.firebaseio.com}
firebase.api-key=${FIREBASE_API_KEY:AIzaSyCfoKYRrKA2qRtnPRgkeYirHVbqPwPZvDk}
firebase.auth-url=${FIREBASE_AUTH_URL:https://identitytoolkit.googleapis.com/v1}
app.allowed-origins=${ALLOWED_ORIGINS:https://abeia-cc22d.web.app,https://abeia-cc22d.firebaseapp.com,http://localhost:5173}
